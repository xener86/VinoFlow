services:
  db:
    # Use pgvector image for semantic search (Phase 5). If you don't need that,
    # you can swap back to postgres:16-alpine.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-vinoflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-vinoflow}
    volumes:
      # Le schéma (db/init.sql + db/migrations) est appliqué par le backend au
      # démarrage : plus de script d'init monté ici.
      - vinoflow-db:/var/lib/postgresql/data
    networks:
      - vinoflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vinoflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3100
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (use a long random string)}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5001}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ALLOW_CLIENT_AI_KEYS=${ALLOW_CLIENT_AI_KEYS:-true}
      - ALLOW_SIGNUP=${ALLOW_SIGNUP:-false}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - APP_URL=${APP_URL:-}
      - SWEEGO_API_KEY=${SWEEGO_API_KEY:-}
      # Enrichissement des fiches par Claude Code sur l'abonnement (claude setup-token)
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - ENRICH_ENGINE=${ENRICH_ENGINE:-auto}
      - ENRICH_DAILY_LIMIT=${ENRICH_DAILY_LIMIT:-30}
      - ENRICH_TICK_MINUTES=${ENRICH_TICK_MINUTES:-60}
      # Cote des vins (valeur de la cave), recherche web trimestrielle
      - VALUATION_ENABLED=${VALUATION_ENABLED:-true}
      - VALUATION_DAILY_LIMIT=${VALUATION_DAILY_LIMIT:-15}
      - VALUATION_TICK_MINUTES=${VALUATION_TICK_MINUTES:-60}
      - MAIL_FROM=${MAIL_FROM:-}
      # Sommelier en un appel avec outils (repli automatique sur le pipeline en cas d'échec)
      - VINOFLOW_SOMMELIER_AGENT=${VINOFLOW_SOMMELIER_AGENT:-true}
      - NODE_ENV=production
    networks:
      - vinoflow-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${VINOFLOW_PORT:-5001}:80"
    networks:
      - vinoflow-network
    depends_on:
      backend:
        condition: service_healthy

  # Sauvegarde quotidienne de la base dans ./backups (rotation 7 jours + 4 semaines).
  # Restauration : voir README, section « Sauvegardes ».
  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    entrypoint: ["bash", "/usr/local/bin/vinoflow-backup.sh"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-vinoflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-vinoflow}
      - BACKUP_HOUR=${BACKUP_HOUR:-3}
      - BACKUP_KEEP_DAILY=${BACKUP_KEEP_DAILY:-7}
      - BACKUP_KEEP_WEEKLY=${BACKUP_KEEP_WEEKLY:-4}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/vinoflow-backup.sh:ro
      - ./backups:/backups
    networks:
      - vinoflow-network
    depends_on:
      db:
        condition: service_healthy

volumes:
  vinoflow-db:

networks:
  vinoflow-network:
    driver: bridge
