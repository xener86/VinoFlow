server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # En-têtes de sécurité, posés par location : un `add_header` dans un bloc
    # location annule ceux du bloc server, et /api/ reçoit déjà ceux de helmet
    # (les doubler créerait des valeurs contradictoires).
    # Pas de HSTS ici (nginx écoute en HTTP) : à poser sur le reverse proxy TLS.
    # CSP limitée aux directives sans risque de casse. Tailwind est compilé et
    # plus aucun appel IA ne part du navigateur : un script-src/connect-src
    # strict est désormais possible, à valider page par page (polices Google,
    # cartes) avant de l'activer.

    # API proxy vers backend (le backend ajoute ses propres en-têtes via helmet)
    location /api/ {
        # Défaut nginx = 1 Mo : trop peu pour l'import CSV (2 Mo) et la
        # restauration JSON (25 Mo). Le backend applique ses propres limites.
        client_max_body_size 26m;
        proxy_pass http://backend:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Pages publiques de partage (/p/<jeton>) : mêmes en-têtes que le reste du
    # front, plus noindex pour les robots qui n'exécutent pas le JS (la page
    # ajoute aussi une balise meta robots). add_header n'hérite pas : tout est
    # répété ici.
    location ^~ /p/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    }

    # Frontend SPA (index.html jamais mis en cache : il référence les bundles hashés)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    }

    # Cache des assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
