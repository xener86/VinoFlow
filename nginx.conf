server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # En-têtes de sécurité, posés par location : un `add_header` dans un bloc
    # location annule ceux du bloc server, et /api/ reçoit déjà ceux de helmet
    # (les doubler créerait des valeurs contradictoires).
    # Pas de HSTS ici (nginx écoute en HTTP) : à poser sur le reverse proxy TLS.
    # CSP limitée aux directives sans risque de casse : index.html charge le CDN
    # Tailwind et un script de config inline, et le navigateur appelle
    # directement les API IA (Gemini/OpenAI/Mistral) — un script-src/connect-src
    # strict demanderait d'abord de bundler Tailwind.

    # API proxy vers backend (le backend ajoute ses propres en-têtes via helmet)
    location /api/ {
        proxy_pass http://backend:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend SPA (index.html jamais mis en cache : il référence les bundles hashés)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    }

    # Cache des assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
